<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClawNews — Redesign Exploration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="tweaks-panel.jsx"></script>
  <script type="text/babel" src="clawnews-components.jsx"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #0a0a0a;
      font-family: "Inter", system-ui, sans-serif;
      overflow: hidden;
    }
    #root { height: 100vh; }

    ::-webkit-scrollbar { width: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 10px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 120 80" xmlns="http://www.w3.org/2000/svg">
      <rect width="120" height="80" fill="#0c1a17"/>
      <rect x="20" y="16" width="36" height="48" rx="3" fill="#152620" stroke="#34d399" stroke-width="0.5"/>
      <rect x="64" y="22" width="22" height="36" rx="4" fill="#152620" stroke="#34d399" stroke-width="0.5"/>
      <rect x="22" y="20" width="20" height="2" rx="1" fill="#34d399" opacity="0.7"/>
      <rect x="22" y="25" width="30" height="1.5" rx="1" fill="#dff0e8" opacity="0.3"/>
      <rect x="22" y="29" width="26" height="1.5" rx="1" fill="#dff0e8" opacity="0.2"/>
    </svg>
  </template>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
      "theme": "analytical"
    }/*EDITMODE-END*/;

    const { TweaksPanel, useTweaks, TweakSection, TweakRadio } = window;

    // ── Browser frame chrome ──────────────────────────────────
    function BrowserChrome({ width, height, children, label }) {
      const CHROME_H = 38;
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center', flexShrink: 0 }}>
          <div style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.12em', textTransform: 'uppercase' }}>{label}</div>
          <div style={{ width, height, borderRadius: 10, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.10)', boxShadow: '0 32px 80px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.04)', display: 'flex', flexDirection: 'column', background: '#1c1c1c' }}>
            {/* Mac-style title bar */}
            <div style={{ height: CHROME_H, background: '#252525', borderBottom: '1px solid rgba(255,255,255,0.07)', display: 'flex', alignItems: 'center', padding: '0 14px', gap: 10, flexShrink: 0 }}>
              <div style={{ display: 'flex', gap: 6 }}>
                {['#ff5f57','#febc2e','#28c840'].map(c => <div key={c} style={{ width: 11, height: 11, borderRadius: '50%', background: c, opacity: 0.85 }} />)}
              </div>
              <div style={{ flex: 1, height: 22, borderRadius: 5, background: 'rgba(255,255,255,0.07)', display: 'flex', alignItems: 'center', padding: '0 10px', gap: 6 }}>
                <div style={{ width: 8, height: 8, borderRadius: '50%', background: 'rgba(255,255,255,0.15)' }} />
                <span style={{ fontSize: 10, color: 'rgba(255,255,255,0.30)', letterSpacing: '0.01em' }}>clawnews.app</span>
              </div>
            </div>
            {/* Page content */}
            <div style={{ flex: 1, overflow: 'hidden', position: 'relative' }}>
              {children}
            </div>
          </div>
        </div>
      );
    }

    // ── Phone frame ──────────────────────────────────────────
    function PhoneChrome({ width, height, children, label }) {
      const BEZEL = 10;
      const NOTCH_W = 100;
      const NOTCH_H = 26;
      const outerW = width + BEZEL * 2;
      const outerH = height + BEZEL * 2 + 12;
      return (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10, alignItems: 'center', flexShrink: 0 }}>
          <div style={{ fontSize: 10, fontWeight: 600, color: 'rgba(255,255,255,0.35)', letterSpacing: '0.12em', textTransform: 'uppercase' }}>{label}</div>
          <div style={{ width: outerW, height: outerH, borderRadius: 44, background: '#1e1e1e', border: '1px solid rgba(255,255,255,0.12)', boxShadow: '0 32px 80px rgba(0,0,0,0.70), inset 0 1px 0 rgba(255,255,255,0.08)', position: 'relative', overflow: 'hidden', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            {/* Inner screen */}
            <div style={{ width, height, borderRadius: 36, overflow: 'hidden', position: 'relative', background: '#000' }}>
              {children}
              {/* Notch overlay */}
              <div style={{ position: 'absolute', top: 0, left: '50%', transform: 'translateX(-50%)', width: NOTCH_W, height: NOTCH_H, background: '#1e1e1e', borderRadius: '0 0 18px 18px', zIndex: 200, pointerEvents: 'none' }} />
            </div>
            {/* Side buttons */}
            <div style={{ position: 'absolute', right: -2, top: 90, width: 3, height: 60, borderRadius: 2, background: '#2e2e2e' }} />
            <div style={{ position: 'absolute', left: -2, top: 80, width: 3, height: 36, borderRadius: 2, background: '#2e2e2e' }} />
            <div style={{ position: 'absolute', left: -2, top: 128, width: 3, height: 60, borderRadius: 2, background: '#2e2e2e' }} />
          </div>
        </div>
      );
    }

    // ── Theme badge ──────────────────────────────────────────
    function ThemeBadge({ theme }) {
      const labels = { editorial: 'Editorial — Spacious, serif headings, warm green', analytical: 'Analytical — Structured, blue-tinted, data-forward', dark: 'Dark — Immersive, high contrast, teal accents' };
      const colors = { editorial: '#0f766e', analytical: '#0369a1', dark: '#34d399' };
      return (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <div style={{ width: 8, height: 8, borderRadius: '50%', background: colors[theme] || '#888', flexShrink: 0 }} />
          <span style={{ fontSize: 12, color: 'rgba(255,255,255,0.55)', fontStyle: 'italic' }}>{labels[theme] || theme}</span>
        </div>
      );
    }

    // ── Canvas ───────────────────────────────────────────────
    function DesignCanvas() {
      const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
      const theme = tweaks.theme || 'editorial';

      const DESKTOP_W = 860;
      const DESKTOP_H = 620;
      const MOBILE_W = 375;
      const MOBILE_H = 620;

      return (
        <div style={{ height: '100vh', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 20, overflow: 'auto', padding: '24px 40px', background: 'radial-gradient(ellipse at 50% 30%, #141414 0%, #0a0a0a 70%)' }}>
          {/* Header row */}
          <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', width: '100%', maxWidth: DESKTOP_W + MOBILE_W + 60 }}>
            <div>
              <div style={{ fontSize: 13, fontWeight: 700, color: 'rgba(255,255,255,0.75)', letterSpacing: '-0.01em' }}>ClawNews — Redesign Exploration</div>
              <ThemeBadge theme={theme} />
            </div>
            <div style={{ display: 'flex', gap: 6 }}>
              {['editorial', 'analytical', 'dark'].map(t => (
                <button key={t} onClick={() => setTweak('theme', t)} style={{ padding: '5px 13px', borderRadius: 6, border: `1px solid ${theme === t ? 'rgba(255,255,255,0.3)' : 'rgba(255,255,255,0.08)'}`, background: theme === t ? 'rgba(255,255,255,0.10)' : 'transparent', color: theme === t ? 'rgba(255,255,255,0.9)' : 'rgba(255,255,255,0.35)', fontSize: 11, fontWeight: 600, cursor: 'pointer', textTransform: 'capitalize', transition: 'all 0.15s', letterSpacing: '0.03em' }}>
                  {t}
                </button>
              ))}
            </div>
          </div>

          {/* Devices */}
          <div style={{ display: 'flex', gap: 40, alignItems: 'flex-start', flexWrap: 'nowrap' }}>
            <BrowserChrome label={`Desktop · ${DESKTOP_W}px`} width={DESKTOP_W} height={DESKTOP_H}>
              <ClawNewsApp theme={theme} isMobile={false} />
            </BrowserChrome>
            <PhoneChrome label="iPhone · 375px" width={MOBILE_W} height={MOBILE_H}>
              <ClawNewsApp theme={theme} isMobile={true} />
            </PhoneChrome>
          </div>

          {/* Footer hint */}
          <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.20)', letterSpacing: '0.08em', textTransform: 'uppercase' }}>
            Click "Open event" to navigate · "View source profiles" opens the drawer · Switch themes above or via Tweaks
          </div>

          <TweaksPanel>
            <TweakSection title="Visual direction">
              <TweakRadio
                label="Theme"
                value={theme}
                options={[
                  { value: 'editorial', label: 'Editorial' },
                  { value: 'analytical', label: 'Analytical' },
                  { value: 'dark', label: 'Dark' },
                ]}
                onChange={v => setTweak('theme', v)}
              />
            </TweakSection>
          </TweaksPanel>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<DesignCanvas />);
  </script>
</body>
</html>
